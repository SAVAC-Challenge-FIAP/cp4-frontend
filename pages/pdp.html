<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" href="../css/pdp.css">
</head>
<body>
    <img src="../img//home/produto-casaco.png" alt="Casaco" class="produto-img">
    <p class="categoria">Loja/Roupas</p>
    <div class="titulo">
        <h1>Cardigã de Lã de Alpaca</h1>
        <h2>R$248</h2>
    </div>
    <p class="descricao">Uma interpretação contemporânea e feminina do cardigã clássico, confeccionada em um tricô de tranças leve e macio,
    utilizando uma mistura luxuosa de baby alpaca e lã virgem.</p>

    <p>Product color:</p>
    <div class="cores">
        <button class="cor1"></button>
        <button class="cor2"></button>
        <button class="cor3"></button>
    </div>
    <p>Product Size:</p>
    <div class="tamanhos">
        <button>PP</button>
        <button>P</button>
        <button>M</button>
        <button>G</button>
        <button>GG</button>
    </div>
    <button class="btn-carrinho">Adicionar ao carrinho</button>

</body>
</html>
