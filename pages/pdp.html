<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pdp.css">
</head>

<body>
    <div class="container-fluid p-0">
    
        <img src="../img/home/produto-casaco.png" alt="Casaco" class="img-fluid w-100">
    
        <div class="conteudo" style="padding: 0 10px 10px 10px;">
    
            <p class="text-secondary mt-4 small">
                Loja/Roupas
            </p>
    
            <div class="text-center fs-2 fw-semibold">
                <p class="mb-2">
                    Cardigã de Lã de Alpaca
                </p>
    
                <p>
                    R$248
                </p>
            </div>
    
            <p class="mt-4 small">
                Uma interpretação contemporânea e feminina do cardigã clássico,
                confeccionada em um tricô de tranças leve e macio, utilizando uma
                mistura luxuosa de baby alpaca e lã virgem.
            </p>
    
            <p class="mt-4">
                Cores:
            </p>
    
            <div id="cores">
                <button id="cor1"></button>
                <button id="cor2"></button>
                <button id="cor3"></button>
            </div>
    
            <p class="mt-4">
                Tamanhos:
            </p>
    
            <div class="d-flex justify-content-between me-5">
                <button class="btn btn-outline-dark tamanho">PP</button>
                <button class="btn btn-outline-dark tamanho">P</button>
                <button class="btn btn-outline-dark tamanho">M</button>
                <button class="btn btn-outline-dark tamanho">G</button>
                <button class="btn btn-outline-dark tamanho">GG</button>
            </div>
            <button class="btn btn-dark rounded-0 w-100 mt-4" style="height: 50px;">
                Adicionar ao carrinho
            </button>
        </div>
    </div>
</body>
</html>
